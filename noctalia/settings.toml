capsule = true

[widget.media]
album_art_only = true
anchor = true
art_size = 20
hide_when_no_media = true
show_progress = true

[widget.ram_used]
highlight_color = "#FF0030"

[widget.temp]
highlight_color = "on_tertiary"

[widget.workspaces]
font_family = "Maple Mono CN SemiBold"
font_weight = 600