[notification]
offset_y = 9
position = "top_center"

[plugins]
auto_update = "official"
enabled = []

[shell]
corner_radius_scale = 0.5000000074505806
font_family = "Maple Mono"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    list_item_background = true

    [shell.screen_corners]
    size = 28

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
shell_mode = "dark"
source = "builtin"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "cava" ]

[wallpaper]
directory = "/home/mx/Pictures/wallpapers"
enabled = true
transition_duration = 7200
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/mx/Pictures/wallpapers/00096.jpg"

    [wallpaper.last]
    path = "/home/mx/Pictures/wallpapers/00096.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mx/Pictures/wallpapers/00096.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/mx/Pictures/wallpapers/00035.png"

