[dock]
position = "top"
smart_auto_hide = true

[hot_corners]
enabled = true

    [hot_corners.bottom_left]
    action = "command"
    command = " hyprctl dispatch 'hl.dsp.focus({ workspace = \"+1\" })'"

    [hot_corners.bottom_right]
    action = "command"
    command = "hyprctl eval 'require(\"configs.function\").workspace.toggle_empty()'"

    [hot_corners.top_left]
    action = "command"
    command = "hyprctl dispatch 'hl.dsp.focus({ workspace = \"-1\" })'"

    [hot_corners.top_right]
    action = "window_switcher"

