[notification]
offset_y = 9
position = "top_center"

[plugins]
auto_update = "official"

[shell]
avatar_path = "/home/mx/Pictures/wallpapers/00030.png"
corner_radius_scale = 0.5000000074505806
font_family = "Maple Mono"
lang = "zh-Hans"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true

    [shell.panel]
    control_center_placement = "floating"
    list_item_background = true
    transparency_mode = "glass"

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "cava" ]

[wallpaper]
directory = "/home/mx/Pictures/wallpapers"
enabled = true
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/mx/Pictures/wallpapers/00009.png"

    [wallpaper.last]
    path = "/home/mx/Pictures/wallpapers/00009.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mx/Pictures/wallpapers/00009.png"

    [wallpaper.monitors.eDP-1]
    path = "color:#39C5BB"

[widget.clock]
capsule = true

[widget.media]
album_art_only = true
anchor = true
art_size = 20
hide_when_no_media = true
show_progress = true

[widget.ram_used]
highlight_color = "on_secondary"
stat = "ram_used"
type = "sysmon"

[widget.temp]
highlight_color = "on_tertiary"
stat = "cpu_temp"
type = "sysmon"

[widget.wallpaper]
enabled = false

[widget.workspaces]
font_family = "Maple Mono CN SemiBold"
font_weight = 600
