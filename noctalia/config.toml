# 手写层（会被 GUI 写入的 ~/.local/state/noctalia/settings.toml 覆盖）。
# 这里只放 GUI 管不到、或者你不希望 GUI 接管的设置；
# 其余设置请在设置界面里改，或直接改 noctalia/settings.toml。

[bar]
order = [ "main" ]

    [bar.main]
    enabled = true
    font_family = "Maple Mono CN"
    position = "top"
    start = [ "arch-logo", "workspaces" ]

[shell]
avatar_path = "/home/mx/Pictures/wallpapers/00030.png"
lang = "zh-Hans"

    [shell.panel]
    control_center_placement = "floating"
    transparency_mode = "glass"

[widget.arch-logo]
custom_image = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = false
interactive = false
scale = 1.3
type = "custom_button"

[widget.ram_used]
stat = "ram_used"
type = "sysmon"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"

[widget.wallpaper]
enabled = false
