[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.39999999105930328
    border = "on_tertiary"
    border_width = 1.5
    capsule = true
    capsule_fill = "on_surface"
    capsule_opacity = 0.69999998435378075
    capsule_thickness = 0.82999998517334461
    center = [ "clock", "media" ]
    color = "on_primary"
    enabled = true
    end = [
        "tray",
        "notifications",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "ram_used",
        "temp",
        "battery",
        "control-center",
        "session"
    ]
    font_family = "Maple Mono CN"
    font_weight = 700
    position = "top"
    start = [ "workspaces" ]
    widget_spacing = 10

        [bar.main.monitor.dp-1]

