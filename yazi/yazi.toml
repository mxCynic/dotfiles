[mgr]
layout = [1, 4, 3]
sort_by = "alphabetical"
sort_sensitive = true
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = false
show_symlink = true


[preview]
image_delay = 0
tab_size = 2
max_width = 600
max_height = 900
cache_dir = "~/.config/yazi/cache"
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim %s', block = true, for = "unix" },
  { run = 'code %s', orphan = true, for = "windows" },
]
open = [
  # { run = 'nvim %s', desc = "Open", for = "linux" },
  { run = 'open %s', desc = "Open", for = "macos" },
  { run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
  { run = 'open -R %s1', desc = "Reveal", for = "macos" },
  { run = 'explorer /select,%s1', orphan = true, desc = "Reveal", for = "windows" },
  { run = 'clear; exiftool %s1; echo "Press enter to exit"; read _', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'unar %s1', desc = "Extract here", for = "unix" },
  { run = 'unar %s1', desc = "Extract here", for = "windows" },
]
play = [
  { run = 'mpv %s', orphan = true, for = "unix" },
  { run = 'mpv %s1', orphan = true, for = "windows" },
  { run = 'mediainfo %s1; echo "Press enter to exit"; read _', block = true, desc = "Show media info", for = "unix" },
]
image = [
  { run = '''
wallpaper_dir="$HOME/Pictures/wallpapers"
wallpaper_dir="$(cd -- "$wallpaper_dir" && pwd -P)"
file="%s1"
file_dir="$(cd -- "$(dirname -- "$file")" && pwd -P)"

if [ "$file_dir" = "$wallpaper_dir" ]; then
  noctalia msg wallpaper-set "$file" ||
    notify-send -u critical "设置壁纸失败" "noctalia 未运行?"
else
  imv "$file"
fi
''' },
]
read = [{ run = 'sioyek %s', orphan = true }]

wps-word = [{ run = 'wps %s1', orphan = true }]
wps-ppt = [{ run = 'wpp %s1', orphan = true }]
wps-excel = [{ run = 'et %s1', orphan = true }]

[open]
rules = [
  { url = "*.doc", use = [
    "wps-word",
  ] },
  { url = "*.docx", use = [
    "wps-word",
  ] },
  { url = "*.xls", use = [
    "wps-excel",
  ] },
  { url = "*.xlsx", use = [
    "wps-excel",
  ] },
  { url = "*.xlsm", use = [
    "wps-excel",
  ] },
  { url = "*.ppt", use = [
    "wps-ppt",
  ] },
  { url = "*.pptx", use = [
    "wps-ppt",
  ] },

  { url = "*/", use = [
    "edit",
    "open",
    "reveal",
  ] },
  { url = "*.pdf", use = [
    "read",
  ] },


  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  { mime = "image/*", use = [
    "image",
  ] },
  { mime = "video/*", use = [
    "play",
    "reveal",
  ] },
  { mime = "audio/*", use = [
    "play",
    "reveal",
  ] },
  { mime = "inode/x-empty", use = [
    "edit",
    "reveal",
  ] },

  { mime = "application/json", use = [
    "edit",
    "reveal",
  ] },
  { mime = "*/javascript", use = [
    "edit",
    "reveal",
  ] },

  { mime = "application/zip", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/gzip", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/x-tar", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/x-bzip", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/x-bzip2", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/x-7z-compressed", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/x-rar", use = [
    "extract",
    "reveal",
  ] },

  { mime = "*", use = [
    "open",
    "reveal",
  ] },
]

[tasks]
micro_workers = 5
macro_workers = 10
bizarre_retry = 5
image_alloc = 536870912 # 512MB
image_bound = [0, 0]

[plugins]
preload = []

[input]
# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# trash
trash_title = "Move {n} selected file{s} to trash? (y/N)"
trash_origin = "top-center"
trash_offset = [0, 2, 50, 3]

# delete
delete_title = "Delete {n} selected file{s} permanently? (y/N)"
delete_origin = "top-center"
delete_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

# overwrite
overwrite_title = "Overwrite an existing file? (y/N)"
overwrite_origin = "top-center"
overwrite_offset = [0, 2, 50, 3]

# quit
quit_title = "{n} task{s} running, sure to quit? (y/N)"
quit_origin = "top-center"
quit_offset = [0, 2, 50, 3]

[select]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[log]
enabled = false
