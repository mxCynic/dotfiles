general {
    lock_cmd = /home/mx/.dotfiles/mxbin/hyprlock-capture
    before_sleep_cmd = loginctl lock-session    # lock before manual suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 900                                                     # 15min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'                # avoid output reconfiguration shortly after lock.
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'                  # screen on when activity is detected after timeout has fired.
}
