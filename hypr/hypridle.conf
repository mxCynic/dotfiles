general {
    lock_cmd = true                             # no-op: D-Bus Lock requests must not re-trigger locking (Noctalia shows the lock screen).
    before_sleep_cmd = loginctl lock-session    # lock before manual suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 900                                 # 15min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
    ignore_inhibit = true                         # lock even when apps ask to stay awake (audio, calls)
}
