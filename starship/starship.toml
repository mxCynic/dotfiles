add_newline = false
# 定义 Prompt 的显示格式，删掉了 $git_branch 和 $git_status
format = """$os\
$username\
$hostname\
$localip\
$shlvl\
$directory\
${custom.jj_bookmark}\
${custom.jj} \
$rust\
$python\
$lua\
$nodejs\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# 这里的 $fill 可以把路径和后面的时间信息撑开（如果需要的话）
[fill]
symbol = " "


[os]
disabled = false
style = "bold blue" # 你可以根据喜好改颜色
[os.symbols]
Arch = "󰣇 "

[directory]
truncation_length = 3
style = "bold cyan"

# custom module for jj status
[custom.jj_bookmark]
description = "The current jj bookmark"
when = "jj --ignore-working-copy root"
symbol = "󱗆 "
style = "bold blue"
ignore_timeout = true
command = '''
BOOKMARK=$(jj log -r "latest(ancestors(@) & bookmarks())" --ignore-working-copy --no-graph -T "bookmarks.map(|b| b.name()).join(\",\")" -n 1)
echo "$BOOKMARK:"
'''

[custom.jj]
description = "The current jj status"
when = "jj --ignore-working-copy root"
symbol = ""
style = "bold blue"
command = '''
jj log --revisions @ --no-graph --ignore-working-copy --color always --limit 1 --template '
  separate(" ",
    change_id.shortest(4),
    bookmarks,
    "|",
    concat(
      if(conflict, "💥"),
      if(divergent, "🚧"),
      if(hidden, "👻"),
      if(immutable, "🔒"),
    ),
    raw_escape_sequence("\x1b[1;32m") ++ if(empty, "(empty)"),
    raw_escape_sequence("\x1b[1;32m") ++ coalesce(
      truncate_end(29, description.first_line(), "…"),
      "(no description set)",
    ) ++ raw_escape_sequence("\x1b[0m"),
  )
'
'''

# optionally disable git modules when JJ is found.
# note that you'll need to add ${custom.git_branch}, ${custom.git_commit} etc
# into format: https://starship.rs/config/#default-prompt-format
[git_status]
disabled = true

[custom.git_status]
when = "! jj --ignore-working-copy root"
command = "starship module git_status"
style = ""                                                     # This disables the default "(bold green)" style
description = "Only show git_status if we're not in a jj repo"

[git_commit]
disabled = true

[custom.git_commit]
when = "! jj --ignore-working-copy root"
command = "starship module git_commit"
style = ""
description = "Only show git_commit if we're not in a jj repo"

[git_metrics]
disabled = true

[custom.git_metrics]
when = "! jj --ignore-working-copy root"
command = "starship module git_metrics"
description = "Only show git_metrics if we're not in a jj repo"
style = ""

[git_branch]
disabled = true

[git_state]
disabled = true

[custom.git_branch]
when = "! jj --ignore-working-copy root"
command = "starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"
style = ""


[time]
disabled = false
format = "[$time]($style)"
style = "bold fg:#39c5bb"
# 设置时间格式（例如 15:30:05）
time_format = "%T"

[character]
# 将默认的 ❯ 替换为 λ
success_symbol = "[λ](bold green)"
error_symbol = "[λ](bold red)"
