# Linux QQ 启动参数补丁。
#
# 注意：此文件只被 Arch AUR linuxqq 包自带的启动包装
# /usr/bin/linuxqq（PKGBUILD 中的 linuxqq.sh）读取。
# 官方 deb/rpm 包及其他 AUR linuxqq 变体不一定走这个机制，
# 换用其他包之前先确认其启动器是否读取 qq-flags.conf。
#
# 2026-09-09: 保持 QQ 原生 Wayland 模式。
# - 剪贴板：QQ 原生 Wayland 下复制仍走隐藏 X11 客户端，cliphist 收不到，
#   此前由 Hyprland autostart 启动的 xwayclip 桥接；2026-09-20 因其会把
#   X11 剪贴板的清空同步成 Wayland 剪贴板清空而移除，目前无覆盖方案。
# - 退格：启动wyalnd模式默认会使用 text-input-v3
#   这回导致fcitx5 退格删到最后一个字符会卡一下，需要按两次退格
#   用下面wayland-text-input-version这个参数强制走 text-input-v1 解决。
#
# Wayland 窗口模式：
# --enable-features=UseOzonePlatform
# --ozone-platform=wayland
# --enable-wayland-ime
# # text-input-v1 参数：
# --wayland-text-input-version=1
