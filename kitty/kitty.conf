# Font Configuration
# BEGIN_KITTY_FONTS
font_family      family="Maple Mono CN" style="Italic"
bold_font        family="Maple Mono CN" style="Bold Italic"
italic_font      family="Maple Mono CN" style="Italic"
bold_italic_font family="Maple Mono CN" style="Bold Italic"
font_size 14.0
# END_KITTY_FONTS


# Window Configuration
window_padding_width 8
# Rounded pane cards: the margin gives the border room to curve, while
# disabling minimal borders makes the radius visible on every pane edge.
window_border_width 1px
window_border_radius 8px
window_margin_width 4
draw_minimal_borders no
# Dim inactive panes only when a split is visible, not whenever the whole
# OS window loses focus.
inactive_text_alpha -0.85
background_opacity 1
background_blur 0
hide_window_decorations yes
# Hyprland reports tiled windows as maximized, so kitty would restore that state as pseudo-fullscreen
remember_window_size no

# Cursor Configuration
cursor_trail 1
cursor_blink_interval 1
shell_integration enabled
confirm_os_window_close 2

enabled_layouts splits, stack, tall

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select no
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n launch --location=split
map ctrl+shift+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+q prev_tab
map ctrl+shift+e next_tab
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window bottom
map ctrl+shift+k neighboring_window top
map ctrl+shift+l neighboring_window right
map ctrl+shift+d launch --location=vsplit
map ctrl+shift+v kitten clipboard_or_save_image.py

# Shell integration
shell_integration enabled

# Dank color generation
include dank-theme.conf


enable_audio_bell no

include current-theme.conf
map kitty_mod+t new_tab_with_cwd

scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

map f1 kitten choose-file --initial-location ~

# ── Tab bar: horizontal tabs along the bottom ─────────────────────────
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_align start
# Rounded floating chips; "separator"/"fade" are the flatter alternatives
tab_bar_style powerline
tab_powerline_style round
# Sidebar panel is barely visible through the 80% transparent window,
# keep it slightly darker than the terminal background for separation
tab_bar_background #1b1d2b
inactive_tab_background #2f334d
inactive_tab_foreground #9aa5ce
active_tab_background #82aaff
active_tab_foreground #1e2030
# Tab width in cells (21 fits "cargo build --release" without "…")
tab_title_max_length 16
# Inset only horizontally: a vertical (top) margin is painted with the
# first tab's background and makes it look two rows tall
tab_bar_margin_width 0
tab_bar_margin_height 10 10
tab_title_template "{title}"

# Noctalia generates this palette from the wallpaper; do not edit the output.
include themes/noctalia.conf
