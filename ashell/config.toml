# position = "Top"
[modules]
left = ["Os_logo", "Workspaces", ]
center = ["WindowTitle","MediaPlayer" ]
right = ["Tray", "SystemInfo", "Privacy", "Settings", "Tempo" ]



[appearance]
font_name = "Maple Mono CN"
scale_factor = 1.0
style = "Gradient"
opacity = 0.6


primary_color = "#7aa2f7"
success_color = "#9ece6a"
text_color = "#a9b1d6"

workspace_colors = ["#7aa2f7", "#9ece6a"]

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"

[appearance.secondary_color]
base = "#0c0d14"

[[CustomModule]]
name = "Os_logo"
icon = "\uf303\n"

[tempo]
clock_format = "%R %d %b %a"
